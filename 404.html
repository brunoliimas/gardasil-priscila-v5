<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Gardasil BR — Para Ela Também Priscila V5</title>
  <script>
    (function () {
      var parts = location.pathname.split("/").filter(Boolean);
      var root = location.hostname.endsWith("github.io") && parts[0]
        ? "/" + parts[0] + "/"
        : "/";
      location.replace(root);
    })();
  </script>
</head>
<body>
  <p><a href="./">Voltar ao início</a></p>
</body>
</html>
